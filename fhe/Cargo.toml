[workspace]
resolver = "3"
members = ["course", "physics", "protocol", "client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
mini-golfhe-course = { path = "course" }
mini-golfhe-physics = { path = "physics" }
mini-golfhe-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
axum = "0.8"
